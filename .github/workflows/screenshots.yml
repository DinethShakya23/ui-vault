name: Screenshots

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Recapture every screenshot"
        type: boolean
        default: false
      only:
        description: "Only these slugs (comma separated, optional)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["data/**", "refs/**", "scripts/**", "templates/**"]
  schedule:
    - cron: "0 2 1 * *" # monthly refresh, 1st of the month 02:00 UTC

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          node scripts/capture.mjs $ARGS

      - name: Build README and gallery
        run: node scripts/build.mjs

      - name: Report failures
        if: hashFiles('capture-failures.md') != ''
        run: cat capture-failures.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          rm -f capture-failures.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md gallery
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update screenshots and gallery [skip ci]"
            git push
          fi
