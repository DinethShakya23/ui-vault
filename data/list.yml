# Source of truth for the list. README.md and gallery/ are generated from this file.
# Edit here, then run:  npm run build
#
# Entry fields:
#   name, url, desc        required
#   tags                   free | paid | react | vue | svelte | angular | any
#   also                   extra links shown next to the name  [{name, url}]
#   shot                   page to screenshot instead of `url`
#   theme                  light (default) | dark  - colour scheme used for the capture
#   wait                   extra ms to wait before capturing (slow animations)
#   scroll                 px to scroll before capturing (skip a hero, show components)
#   noshot                 true to skip the automatic screenshot
#   refs                   more references for the gallery, any mix of:
#                            {title, url}   captured automatically
#                            {title, link}  linked only (video, Dribbble shot, CodePen...)

sections:
- title: Design Systems
  intro: >-
    Big companies' design systems, most with real code you can install. Even if you never use one, they're some of the best free design education out there.
  groups:
  - items:
    - name: Material Design 3
      url: https://m3.material.io
      desc: Google's design system with dynamic color and expressive motion.
