- title: Motion & Animation
  intro: >-
    For when things need to move. Most projects only need one animation engine, so don't install three.
  groups:
  - title: Animation Engines
    items:
    - name: Motion
      url: https://motion.dev
      desc: Formerly Framer Motion; hybrid WAAPI/JS engine for React, Vue and vanilla JS (layout, gestures, springs).
      tags:
      - free
      - any
    - name: GSAP
      url: https://gsap.com
      desc: Industry-standard timeline engine; all plugins (ScrollTrigger, SplitText, MorphSVG, Flip) now free.
      tags:
      - free
      - any
      refs:
      - title: Showcase
        url: https://gsap.com/showcase/
    - name: Anime.js
      url: https://animejs.com
      desc: Lightweight, modular engine with timelines, draggables and scroll observers.
      tags:
      - free
      - any
    - name: React Spring
